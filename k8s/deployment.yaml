apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-task-tracker
  template:
    metadata:
      labels:
        app: devops-task-tracker
    spec:
      containers:
        - name: task-tracker
          image: devops-task-tracker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/tasks
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tasks
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: devops-task-tracker
spec:
  type: NodePort
  selector:
    app: devops-task-tracker
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
